<!--
  THROWAWAY PROTOTYPE v2 — teambalance issue #5
  Variant C won. This is C refined against the verdict; A and B are dropped
  (they live on in v1 at the first commit of branch prototype/on-court-flow).

  Changes from v1:
   - explicit session START and END; ending a session is what recomputes stars (#6)
   - attendance is a one-time step at session start, with search and avatars
   - "Tonight" groups sets under the lineup that played them, named by its teams,
     replacing the meaningless L1/L2 labels
   - Shuffle and Rebalance are never both on screen: shuffle before a lineup has
     played, rebalance after

  NOT production code. Ratings/sets-played stubbed as if three sessions were replayed.
  Balancer (#8) and rating delta (#6) are the real rules, ported inline.
-->
<title>teambalance — on-court flow prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --ground: #f2f4f1; --surface: #ffffff; --surface-2: #e9ece7; --line: #d4dad2;
    --ink: #121d1c; --ink-2: #4c5a58; --ink-3: #7a8785;
    --gold: #b07a10; --gold-soft: #f7e7c4; --navy: #2a4f8f; --navy-soft: #dae3f4;
    --good: #2e7d5b; --warn: #b4561f; --crit: #a8322c;
    --shadow: 0 1px 2px rgba(18,29,28,.08), 0 8px 24px rgba(18,29,28,.06);
    --step--1: .78rem; --step-0: .95rem; --step-1: 1.15rem; --step-2: 1.45rem; --step-3: 1.9rem; --step-4: 2.6rem;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0c1b1f; --surface: #122a30; --surface-2: #18363d; --line: #26474f;
      --ink: #eaf1ef; --ink-2: #a7bcb9; --ink-3: #6f8a88;
      --gold: #e8b347; --gold-soft: #3a2e13; --navy: #7ea6e8; --navy-soft: #16243e;
      --good: #4fbf8b; --warn: #e08a4e; --crit: #e5796f;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0c1b1f; --surface: #122a30; --surface-2: #18363d; --line: #26474f;
    --ink: #eaf1ef; --ink-2: #a7bcb9; --ink-3: #6f8a88;
    --gold: #e8b347; --gold-soft: #3a2e13; --navy: #7ea6e8; --navy-soft: #16243e;
    --good: #4fbf8b; --warn: #e08a4e; --crit: #e5796f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--ui); font-size: var(--step-0); line-height: 1.45; -webkit-text-size-adjust: 100%; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  .phone { max-width: 430px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: var(--ground); position: relative; }
  @media (min-width: 900px) { body { background: var(--surface-2); } .phone { box-shadow: var(--shadow); } }

  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: var(--step--1); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); font-weight: 600; }
  .stars { color: var(--gold); letter-spacing: .08em; font-size: var(--step--1); white-space: nowrap; }
  .muted { color: var(--ink-2); }
  .side-gold { --team: var(--gold); --team-soft: var(--gold-soft); }
  .side-navy { --team: var(--navy); --team-soft: var(--navy-soft); }
  .short-badge { font-size: var(--step--1); font-weight: 700; color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: .05rem .5rem; white-space: nowrap; }

  /* avatar: initials, hue derived from the id — no network, no images */
  .av { width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; font-size: var(--step--1); font-weight: 700; letter-spacing: .02em; flex: 0 0 auto; color: #fff; }
  .av.lg { width: 44px; height: 44px; font-size: var(--step-0); }

  /* ---------- session header ---------- */
  .shead { background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .shead .t { font-weight: 700; }
  .shead .live { font-size: var(--step--1); font-weight: 700; color: var(--good); text-transform: uppercase; letter-spacing: .08em; display: flex; align-items: center; gap: 5px; }
  .shead .live::before { content: ""; width: 7px; height: 7px; border-radius: 999px; background: var(--good); }
  .shead button { margin-left: auto; min-height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); font-size: var(--step--1); font-weight: 700; }

  /* ---------- tabs ---------- */
  .tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--surface); }
  .tabs button { flex: 1; min-height: 48px; border: 0; background: transparent; font-size: var(--step--1); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 700; border-bottom: 3px solid transparent; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

  .scroll { flex: 1; overflow-y: auto; }
  .pad { padding: 14px; display: grid; gap: 10px; align-content: start; }

  /* ---------- court ---------- */
  .court { flex: 1; display: grid; grid-template-rows: 1fr auto 1fr; background: var(--surface); }
  .half { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; background: var(--team-soft); }
  .half .label { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; color: var(--team); font-weight: 800; font-size: var(--step--1); text-transform: uppercase; letter-spacing: .1em; }
  .half ul { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 2px 14px; }
  .half li { font-size: var(--step-2); font-weight: 700; letter-spacing: -.02em; }
  .half li .moved { color: var(--warn); font-size: var(--step--1); vertical-align: .35em; font-weight: 700; }
  .net { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: var(--ink); color: var(--ground); }
  .net .sc { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: var(--step-2); font-weight: 800; }
  .net .meta { font-size: var(--step--1); opacity: .75; line-height: 1.25; }

  .sheet { border-top: 1px solid var(--line); background: var(--surface); padding: 12px 14px 16px; display: grid; gap: 10px; }
  .bigscore { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .bigscore .n { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: var(--step-4); font-weight: 800; text-align: center; line-height: 1; }
  .bigscore .ctrls { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
  .bigscore .ctrls button { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: var(--step-1); font-weight: 700; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; min-height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
  .row button.primary { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .hint { font-size: var(--step--1); color: var(--ink-3); text-align: center; }

  /* ---------- lists ---------- */
  .search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; min-height: 48px; }
  .search input { flex: 1; border: 0; background: transparent; min-height: 46px; outline: none; }
  .prow { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; width: 100%; text-align: left; min-height: 56px; }
  .prow[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .prow[aria-pressed="false"] { opacity: .5; }
  .prow .nm { font-weight: 650; }
  .prow .rt { margin-left: auto; font-size: var(--step--1); color: var(--ink-3); }
  .cta { min-height: 56px; border-radius: 14px; border: 0; background: var(--ink); color: var(--ground); font-size: var(--step-1); font-weight: 700; width: 100%; }
  .cta.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .cta[disabled] { opacity: .4; cursor: not-allowed; }
  .sticky { position: sticky; bottom: 0; padding: 12px 14px; background: linear-gradient(to top, var(--ground) 70%, transparent); }

  .lineupcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .lineupcard > header { padding: 9px 12px; background: var(--surface-2); display: grid; gap: 2px; }
  .lineupcard > header .vs { font-size: var(--step--1); font-weight: 700; }
  .lineupcard > header .vs .g { color: var(--gold); }
  .lineupcard > header .vs .n { color: var(--navy); }
  .lineupcard ul { margin: 0; padding: 4px 0; list-style: none; }
  .lineupcard li { display: flex; align-items: baseline; gap: 10px; padding: 6px 12px; }
  .lineupcard li .sc { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 800; font-size: var(--step-1); }
  .lineupcard li .who { font-weight: 650; }
  .lineupcard li .dl { margin-left: auto; font-size: var(--step--1); color: var(--ink-3); }

  .summary { display: grid; gap: 10px; }
  .statline { display: flex; align-items: baseline; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .statline .big { font-size: var(--step-3); font-weight: 800; letter-spacing: -.03em; }
  .up { color: var(--good); font-weight: 700; }
  .down { color: var(--crit); font-weight: 700; }
</style>

<div class="phone" id="app"></div>

<script>
  const POOL = [
    ["oleksii","Oleksii",1588,22],["dmytro","Dmytro",1642,24],["kateryna","Kateryna",1501,19],
    ["marta","Marta",1455,16],["yulia","Yulia",1390,11],["andrii","Andrii",1664,25],
    ["sergii","Sergii",1536,21],["ivan","Ivan",1472,18],["olena","Olena",1418,9],
    ["taras","Taras",1555,20],["nazar","Nazar",1344,7],["vika","Vika",1489,17],
    ["bohdan","Bohdan",1611,23],["lesia","Lesia",1430,12],["pavlo","Pavlo",1524,20],
    ["iryna","Iryna",1467,15],["maksym","Maksym",1598,22],["sofiia","Sofiia",1376,8],
    ["roman","Roman",1512,19],["danylo","Danylo",1443,13],["hanna","Hanna",1495,16],
    ["yaroslav","Yaroslav",1570,21],["oksana","Oksana",1408,10],["vitalii","Vitalii",1632,24],
    ["zoriana","Zoriana",1482,14]
  ].map(([id,name,rating,sets]) => ({ id, name, rating, sets }));
  const P = Object.fromEntries(POOL.map(p => [p.id, p]));

  const state = {
    phase: "idle",            // idle | attendance | playing | ended
    tab: "court",             // court | pool | tonight
    query: "",
    attending: ["oleksii","dmytro","kateryna","marta","andrii","sergii","ivan","taras","vika","bohdan","maksym"],
    startStars: {},
    lineups: [],
    shortlist: [], shortlistIdx: 0,
    sets: [],
    draft: { a: 25, b: 20 }
  };

  /* ---- the real rules from #6 and #8 ---- */
  const H = 60, ON_COURT = 6, TOL = 15, D_REF = 8;
  const STAR_T = [1275, 1425, 1575, 1725];
  const starsOf = r => 1 + STAR_T.filter(t => r >= t).length;
  const starStr = r => "★".repeat(starsOf(r)) + "☆".repeat(5 - starsOf(r));
  const oncourt = s => Math.min(ON_COURT, s.length);
  const missing = (s, o) => Math.max(0, Math.min(6, oncourt(o)) - oncourt(s));
  const rbar = s => s.reduce((t, id) => t + P[id].rating, 0) / s.length;
  const reff = (s, o) => rbar(s) - H * Math.min(missing(s, o), 2);
  function rankGap(a, b) {
    const sa = a.map(i => P[i].rating).sort((x,y) => y-x), sb = b.map(i => P[i].rating).sort((x,y) => y-x);
    const k = Math.min(sa.length, sb.length);
    let t = 0; for (let i = 0; i < k; i++) t += Math.abs(sa[i] - sb[i]);
    return t / k;
  }
  const cost = (a, b) => Math.abs(reff(a,b) - reff(b,a)) + 0.5 * rankGap(a, b);
  function splits(ids) {
    const nA = Math.ceil(ids.length / 2), out = [], pick = [];
    (function rec(i) {
      if (pick.length === nA) { const a = pick.slice(); out.push({ a, b: ids.filter(x => !a.includes(x)) }); return; }
      if (i >= ids.length) return;
      pick.push(ids[i]); rec(i+1); pick.pop();
      if (ids.length - i - 1 >= nA - pick.length) rec(i+1);
    })(0);
    return out.map(s => ({ ...s, cost: cost(s.a, s.b) }));
  }
  function generate(minHamming) {
    let all = splits(state.attending);
    if (minHamming && state.lineups.length) {
      const cur = state.lineups[state.lineups.length - 1];
      all = all.filter(s => state.attending.filter(id => s.a.includes(id) !== cur.a.includes(id)).length >= minHamming);
    }
    all.sort((p, q) => p.cost - q.cost);
    return all.length ? all.filter(s => s.cost <= all[0].cost + TOL).slice(0, 6) : [];
  }
  function pushLineup(minHamming) {
    state.shortlist = generate(minHamming); state.shortlistIdx = 0;
    const s = state.shortlist[0]; if (!s) return;
    const prev = state.lineups[state.lineups.length - 1];
    state.lineups.push({
      a: s.a, b: s.b, cost: s.cost, prevCost: prev ? prev.cost : null,
      moved: prev ? state.attending.filter(id => s.a.includes(id) !== prev.a.includes(id)) : []
    });
  }
  function useShortlist(i) {
    const s = state.shortlist[i]; if (!s) return;
    state.shortlistIdx = i;
    const cur = state.lineups[state.lineups.length - 1], base = state.lineups[state.lineups.length - 2] || null;
    cur.a = s.a; cur.b = s.b; cur.cost = s.cost;
    cur.moved = base ? state.attending.filter(id => s.a.includes(id) !== base.a.includes(id)) : [];
  }
  function recordSet(pa, pb) {
    const L = state.lineups[state.lineups.length - 1]; if (!L) return;
    const d = Math.abs(pa - pb);
    const M = Math.min(1.5, Math.max(0.5, Math.log(1+d) / Math.log(1+D_REF)));
    const eA = 1 / (1 + Math.pow(10, (reff(L.b, L.a) - reff(L.a, L.b)) / 400));
    const deltas = {};
    [[L.a, pa > pb ? 1 : 0, eA], [L.b, pb > pa ? 1 : 0, 1 - eA]].forEach(([side, sc, e]) => {
      side.forEach(id => {
        const K = 24 + 36 * Math.max(0, (12 - P[id].sets) / 12);
        const dr = Math.max(-50, Math.min(50, K * M * (sc - e)));
        P[id].rating = Math.round(P[id].rating + dr); P[id].sets += 1; deltas[id] = Math.round(dr);
      });
    });
    state.sets.push({ lineup: state.lineups.length, a: pa, b: pb, deltas });
  }

  /* ---- view helpers ---- */
  const el = h => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstElementChild; };
  const nm = id => P[id].name;
  const gap = L => Math.abs(reff(L.a, L.b) - reff(L.b, L.a));
  const hue = id => { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const avatar = (id, lg) => `<span class="av${lg ? " lg" : ""}" style="background:hsl(${hue(id)} 42% 38%)" aria-hidden="true">${P[id].name.slice(0,2).toUpperCase()}</span>`;
  const shortBadge = (s, o) => missing(s, o) ? `<span class="short-badge">a player down</span>` : "";
  const sizeNote = L => `${oncourt(L.a)} v ${oncourt(L.b)}${L.a.length > oncourt(L.a) || L.b.length > oncourt(L.b) ? " · rotating" : ""}`;
  const currentLineup = () => state.lineups[state.lineups.length - 1];
  const setsForLineup = i => state.sets.filter(s => s.lineup === i);

  /* ---- screens ---- */
  function ScreenIdle() {
    const r = el(`<div class="pad" style="padding:28px 16px;gap:18px"></div>`);
    r.append(el(`<div><div class="eyebrow">teambalance</div>
      <div style="font-size:var(--step-3);font-weight:800;letter-spacing:-.03em;text-wrap:balance">No session running</div>
      <div class="muted" style="margin-top:6px">Starting a session is what opens the evening. Ending it is what moves everyone's stars.</div></div>`));
    r.append(el(`<div class="statline"><span class="big num">${POOL.length}</span><span class="muted">players in the pool<br><span class="eyebrow">${state.sets.length ? "last session recorded" : "no sessions recorded yet"}</span></span></div>`));
    const b = el(`<button class="cta">Start Sunday session</button>`);
    b.onclick = () => {
      state.phase = "attendance";
      state.startStars = Object.fromEntries(POOL.map(p => [p.id, starsOf(p.rating)]));
      render();
    };
    r.append(b);
    return r;
  }

  function ScreenAttendance() {
    const r = el(`<div style="display:flex;flex-direction:column;flex:1;min-height:0"></div>`);
    r.append(el(`<div class="shead"><span class="t">Sunday 29 Nov</span><span class="live">session open</span></div>`));
    const body = el(`<div class="scroll"><div class="pad"></div></div>`);
    const pad = body.firstElementChild;
    pad.append(el(`<div><div style="font-size:var(--step-2);font-weight:800;letter-spacing:-.02em">Who turned up?</div>
      <div class="muted" style="font-size:var(--step--1)">Set this once now. Late arrivals go in from the Pool tab.</div></div>`));

    const s = el(`<label class="search"><span aria-hidden="true" style="color:var(--ink-3)">⌕</span>
      <input type="search" placeholder="Search ${POOL.length} players" value="${state.query}" /></label>`);
    const input = s.querySelector("input");
    input.oninput = e => { state.query = e.target.value; render(); setTimeout(() => { const i = document.querySelector(".search input"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 0); };
    pad.append(s);

    const q = state.query.trim().toLowerCase();
    const shown = POOL.filter(p => !q || p.name.toLowerCase().includes(q));
    const here = state.attending.length;
    pad.append(el(`<div class="eyebrow">${here} here · ${here % 2 ? "odd, so one side plays a player down" : "even sides"}</div>`));
    shown.forEach(p => {
      const on = state.attending.includes(p.id);
      const b = el(`<button class="prow" aria-pressed="${on}">${avatar(p.id, true)}
        <span><span class="nm">${p.name}</span><br><span class="stars">${starStr(p.rating)}</span></span>
        <span class="rt">${on ? "here" : ""}</span></button>`);
      b.onclick = () => { state.attending = on ? state.attending.filter(x => x !== p.id) : [...state.attending, p.id]; state.lineups = []; render(); };
      pad.append(b);
    });
    if (!shown.length) pad.append(el(`<div class="muted">Nobody matches “${state.query}”.</div>`));
    r.append(body);

    const foot = el(`<div class="sticky"></div>`);
    const go = el(`<button class="cta" ${here < 4 ? "disabled" : ""}>Make the teams · ${here} here</button>`);
    go.onclick = () => { state.query = ""; pushLineup(0); state.phase = "playing"; state.tab = "court"; render(); };
    foot.append(go);
    r.append(foot);
    return r;
  }

  function Tabs() {
    const t = el(`<div class="tabs" role="tablist"></div>`);
    [["court","Court"],["pool","Pool"],["tonight","Tonight"]].forEach(([k, lab]) => {
      const b = el(`<button role="tab" aria-selected="${state.tab === k}">${lab}${k === "tonight" && state.sets.length ? ` (${state.sets.length})` : ""}</button>`);
      b.onclick = () => { state.tab = k; state.query = ""; render(); };
      t.append(b);
    });
    return t;
  }

  function SessionHeader() {
    const h = el(`<div class="shead"><span class="t">Sunday 29 Nov</span><span class="live">session open</span></div>`);
    const b = el(`<button>End session</button>`);
    b.onclick = () => { state.phase = "ended"; render(); };
    h.append(b);
    return h;
  }

  function TabCourt() {
    const L = currentLineup();
    const wrap = el(`<div style="display:flex;flex-direction:column;flex:1;min-height:0"></div>`);
    const played = setsForLineup(state.lineups.length).length;

    const court = el(`<div class="court"></div>`);
    const half = (label, side, other, cls) => el(`<div class="half ${cls}">
      <div class="label"><span>${label}</span><span>${shortBadge(side, other) || sizeNote(L)}</span></div>
      <ul>${side.map(id => `<li>${nm(id)}${L.moved.includes(id) ? ' <span class="moved">moved</span>' : ""}</li>`).join("")}</ul></div>`);
    court.append(half("Gold", L.a, L.b, "side-gold"));
    court.append(el(`<div class="net"><span class="sc">${state.draft.a} – ${state.draft.b}</span>
      <span class="meta">teams ${state.lineups.length} · gap ${gap(L).toFixed(0)} pts<br>${played} ${played === 1 ? "set" : "sets"} on these teams</span></div>`));
    court.append(half("Navy", L.b, L.a, "side-navy"));
    wrap.append(court);

    const sheet = el(`<div class="sheet"></div>`);
    const big = el(`<div class="bigscore"></div>`);
    [["a","Gold"],["b","Navy"]].forEach(([k, lab], i) => {
      const col = el(`<div><div class="eyebrow" style="text-align:center">${lab}</div><div class="n">${state.draft[k]}</div><div class="ctrls"></div></div>`);
      const m = el(`<button aria-label="minus ${lab}">−</button>`), p = el(`<button aria-label="plus ${lab}">+</button>`);
      m.onclick = () => { state.draft[k] = Math.max(0, state.draft[k] - 1); render(); };
      p.onclick = () => { state.draft[k] = state.draft[k] + 1; render(); };
      col.querySelector(".ctrls").append(m, p);
      if (i === 1) big.append(el(`<div class="muted num" style="align-self:center">–</div>`));
      big.append(col);
    });
    sheet.append(big);

    const row = el(`<div class="row"></div>`);
    /* Shuffle and Rebalance are never both offered: they answer different moments. */
    if (played === 0) {
      const sh = el(`<button>Try another split</button>`);
      sh.onclick = () => { useShortlist((state.shortlistIdx + 1) % state.shortlist.length); render(); };
      row.append(sh);
    } else {
      const rb = el(`<button>Rebalance</button>`);
      rb.onclick = () => { pushLineup(2); render(); };
      row.append(rb);
    }
    const sv = el(`<button class="primary">Save set</button>`);
    sv.onclick = () => { recordSet(state.draft.a, state.draft.b); render(); };
    row.append(sv);
    sheet.append(row);
    sheet.append(el(`<div class="hint">${played === 0
      ? `Same ratings, a different split — all options are within ${TOL} pts of fairest.`
      : `Rebalance makes new teams from ratings as they are now, moving at least two players.`}</div>`));
    wrap.append(sheet);
    return wrap;
  }

  function TabPool() {
    const pad = el(`<div class="pad"></div>`);
    const s = el(`<label class="search"><span aria-hidden="true" style="color:var(--ink-3)">⌕</span>
      <input type="search" placeholder="Search ${POOL.length} players" value="${state.query}" /></label>`);
    s.querySelector("input").oninput = e => { state.query = e.target.value; render(); setTimeout(() => { const i = document.querySelector(".search input"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 0); };
    pad.append(s);
    pad.append(el(`<div class="eyebrow">Tap to add a late arrival or remove someone who left</div>`));
    const q = state.query.trim().toLowerCase();
    POOL.filter(p => !q || p.name.toLowerCase().includes(q)).forEach(p => {
      const on = state.attending.includes(p.id);
      const b = el(`<button class="prow" aria-pressed="${on}">${avatar(p.id, true)}
        <span><span class="nm">${p.name}</span><br><span class="stars">${starStr(p.rating)}</span></span>
        <span class="rt">${p.sets} sets</span></button>`);
      b.onclick = () => { state.attending = on ? state.attending.filter(x => x !== p.id) : [...state.attending, p.id]; render(); };
      pad.append(b);
    });
    pad.append(el(`<div class="muted" style="font-size:var(--step--1)">Stars are all a player is ever shown. Changing who is here does not re-make the teams on its own.</div>`));
    return el(`<div class="scroll"></div>`).appendChild(pad).parentElement;
  }

  function TabTonight() {
    const pad = el(`<div class="pad"></div>`);
    if (!state.sets.length) {
      pad.append(el(`<div class="muted">No sets yet. Save one from the Court tab and it appears here under the teams that played it.</div>`));
    }
    /* grouped by the lineup that played them, named by its actual teams — not "L3" */
    state.lineups.forEach((L, i) => {
      const n = i + 1, ss = setsForLineup(n);
      if (!ss.length) return;
      const card = el(`<div class="lineupcard">
        <header>
          <span class="eyebrow">Teams ${n}${L.moved.length ? ` · ${L.moved.map(nm).join(" ↔ ")} swapped` : ""}</span>
          <span class="vs"><span class="g">${L.a.map(nm).join(", ")}</span><br><span class="n">${L.b.map(nm).join(", ")}</span></span>
        </header><ul></ul></div>`);
      const ul = card.querySelector("ul");
      ss.forEach(s => {
        const top = Object.entries(s.deltas).sort((x,y) => y[1]-x[1])[0];
        ul.append(el(`<li><span class="sc">${s.a}–${s.b}</span><span class="who">${s.a > s.b ? "Gold" : "Navy"}</span>
          <span class="dl">best move ${top[1] > 0 ? "+" : ""}${top[1]} ${nm(top[0])}</span></li>`));
      });
      pad.append(card);
    });
    if (state.sets.length) pad.append(el(`<div class="muted" style="font-size:var(--step--1)">Rating moves are organizer-only. Stars move when you end the session.</div>`));
    return el(`<div class="scroll"></div>`).appendChild(pad).parentElement;
  }

  function ScreenEnded() {
    const r = el(`<div style="display:flex;flex-direction:column;flex:1;min-height:0"></div>`);
    r.append(el(`<div class="shead"><span class="t">Sunday 29 Nov</span><span class="muted eyebrow">session closed</span></div>`));
    const pad = el(`<div class="pad summary"></div>`);
    const changed = state.attending.map(id => ({ id, from: state.startStars[id], to: starsOf(P[id].rating) })).filter(x => x.from !== x.to);
    pad.append(el(`<div style="font-size:var(--step-2);font-weight:800;letter-spacing:-.02em">That's the evening</div>`));
    pad.append(el(`<div class="statline"><span class="big num">${state.sets.length}</span><span class="muted">sets played across ${state.lineups.length} ${state.lineups.length === 1 ? "lineup" : "lineups"}<br><span class="eyebrow">${state.attending.length} players</span></span></div>`));
    if (!changed.length) {
      pad.append(el(`<div class="statline"><span class="muted">Nobody changed star band tonight. That is the normal outcome — bands are 150 points wide and a set moves about 12.</span></div>`));
    } else {
      changed.forEach(c => pad.append(el(`<div class="statline">${avatar(c.id, true)}<span><span class="nm" style="font-weight:650">${nm(c.id)}</span><br>
        <span class="stars">${starStr(P[c.id].rating)}</span></span>
        <span class="${c.to > c.from ? "up" : "down"}" style="margin-left:auto">${c.to > c.from ? "▲" : "▼"} ${c.from} → ${c.to}</span></div>`)));
    }
    const b = el(`<button class="cta ghost">Back to the court</button>`);
    b.onclick = () => { state.phase = "playing"; render(); };
    pad.append(b);
    r.append(el(`<div class="scroll"></div>`)).lastElementChild.append(pad);
    return r;
  }

  function render() {
    const app = document.getElementById("app");
    app.innerHTML = "";
    if (state.phase === "idle") { app.append(ScreenIdle()); return; }
    if (state.phase === "attendance") { app.append(ScreenAttendance()); return; }
    if (state.phase === "ended") { app.append(ScreenEnded()); return; }
    app.append(SessionHeader(), Tabs());
    app.append(state.tab === "court" ? TabCourt() : state.tab === "pool" ? TabPool() : TabTonight());
  }
  render();
</script>
